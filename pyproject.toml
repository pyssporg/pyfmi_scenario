[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfmi-scenario"
dynamic = ["version"]
description = "Scenario-grammar interface model and FMI 2.0 Co-Simulation artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "pyssp contributors" }
]
keywords = [
  "fmi",
  "fmu",
  "scenario",
  "co-simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# The workspace provider is experimental_pyssp_standard, which supplies the
# `pyssp_standard` import package. The URL is the same immutable release asset
# that pyfmi_interfaces pins; do not add a PyPI release alongside it.
dependencies = [
  "pyfmi-interfaces @ https://github.com/pyssporg/pyfmi_interfaces/releases/download/v0.5.2/pyfmi_interfaces-0.5.2-py3-none-any.whl",
  "experimental-pyssp-standard @ https://github.com/pyssporg/experimental_pyssp_standard/releases/download/v0.9.4.dev0/experimental_pyssp_standard-0.9.4.dev0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
  "fmpy>=0.3.29",
  "matplotlib",
  "pytest>=8",
  "ruff>=0.6",
  "build",
]

[project.scripts]
pyfmi-scenario = "pyfmi_scenario.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "pyfmi_scenario.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyfmi_scenario*"]

[tool.setuptools.package-data]
pyfmi_scenario = ["_runtime/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: one object's behaviour, no generated artifact",
]
